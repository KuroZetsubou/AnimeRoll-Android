# Push to main  -> "nightly" pre-release with the APK
# Tag vX.Y.Z    -> release "vX.Y.Z" with the APK (a tag like v1.2.0-beta.1 is a pre-release)
#
# Signing: add these repository secrets to get a signed release APK
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks file (base64 -i release.jks | pbcopy)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the release carries a debug APK: it installs, but every build has a different key,
# so updating means uninstalling the previous version first.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly" >> "$GITHUB_OUTPUT"; echo "version=nightly-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version in the build
        run: |
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${GITHUB_RUN_NUMBER}/; s/versionName = \"[^\"]*\"/versionName = \"${{ steps.v.outputs.version }}\"/" app/build.gradle.kts
          grep -E 'versionCode|versionName' app/build.gradle.kts

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$bt/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS --out "AnimeRoll-${{ steps.v.outputs.version }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify "AnimeRoll-${{ steps.v.outputs.version }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Build debug APK (no signing secrets)
        if: env.HAS_KEY != 'true'
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "AnimeRoll-${{ steps.v.outputs.version }}-debug.apk"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          files=(AnimeRoll-*.apk)
          if [[ "$TAG" == nightly ]]; then
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly "${files[@]}" --target "$GITHUB_SHA" --prerelease --title "Nightly" \
              --notes "Automatic build of \`main\` at ${GITHUB_SHA::7}. Not a stable release."
          else
            pre=(); [[ "$VERSION" == *-* ]] && pre=(--prerelease)
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "AnimeRoll Android $TAG" "${pre[@]}"
            gh release upload "$TAG" "${files[@]}" --clobber
          fi
